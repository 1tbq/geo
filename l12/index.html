<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aid Audit | L12 Year 10 Geography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2340;--acc:#2E4A7D;--grey:#5B6170;--light:#F2F4F8;--copy:#FFF3B0;--gold:#D9A400;--white:#fff;--ok:#1F7A72;--bad:#B4453F;--line:#DDE1EA}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Lexend,Calibri,Arial,sans-serif;background:var(--light);color:var(--ink);line-height:1.45}
button,input{font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:1.5rem;margin:0;font-weight:800}
header.top .sub{color:var(--grey);font-size:.9rem}
.home{font-size:.85rem;color:var(--acc);text-decoration:none;font-weight:600}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--white);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(30,35,64,.08);min-width:0}
.meter h2{font-size:1rem;margin:0 0 6px}
.val{font-size:2.6rem;font-weight:800;line-height:1;margin:4px 0;color:var(--acc)}
.bar{position:relative;height:14px;background:#E4E7EE;border-radius:999px;margin:12px 0 4px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:999px;transition:width .5s}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--grey)}
.stats{display:flex;gap:10px;margin-top:14px;font-size:.85rem}
.stats div{flex:1;background:var(--light);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.2rem}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{font-size:.75rem;padding:5px 10px;border-radius:999px;background:var(--light);color:var(--grey)}
.badge.got{background:var(--copy);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--gold)}
.roundtag{display:inline-block;font-size:.8rem;font-weight:600;color:#fff;background:var(--acc);padding:3px 10px;border-radius:999px}
.count{float:right;font-size:.85rem;color:var(--grey)}
.progress{height:6px;background:#E4E7EE;border-radius:999px;margin:10px 0 16px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:1.25rem;font-weight:600;margin:6px 0 16px;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1rem;cursor:pointer;color:var(--ink);min-height:58px;width:100%}
.opt:hover:not(:disabled){border-color:var(--acc);background:#F7F9FD}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--light);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.right{border-color:var(--ok);background:#E5F3F1}
.opt.wrong{border-color:var(--bad);background:#F8E6E5}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.good{background:#E5F3F1}
.fb.badfb{background:#F8E6E5}
.fb b{display:block;margin-bottom:2px}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:600;font-size:1rem;cursor:pointer;background:var(--acc);color:#fff}
.btn.alt{background:var(--light);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
input.name{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:1rem;margin:8px 0 14px}
.intro-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media (max-width:560px){.intro-cards{grid-template-columns:1fr}}
.ic{background:var(--light);border-radius:12px;padding:12px}
.ic b{display:block}
.ic small{color:var(--grey)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .35s;z-index:5;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.streak{font-weight:800;color:#C9741A}
.review .item{background:var(--light);padding:10px 12px;border-radius:10px;margin:8px 0;font-size:.92rem}
.review .item .ans{color:var(--ok);font-weight:600}
.cert{display:none;border:6px double var(--acc);border-radius:16px;padding:28px;text-align:center;background:#fff;margin-top:16px}
.cert h2{font-size:1.7rem;margin:4px 0}
.cert .big{font-size:2.2rem;font-weight:800;color:var(--acc)}
.kbd{font-size:.78rem;color:var(--grey);margin-top:10px}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{display:block!important;position:absolute;left:0;top:0;width:100%;border-color:#000}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="gtitle"></h1>
      <div class="sub" id="gsub"></div>
    </div>
    <a class="home" href="../">All lessons</a>
  </header>
  <div class="grid">
    <aside class="panel meter" aria-live="polite">
      <h2 id="mlabel"></h2>
      <div class="val" id="mval"></div>
      <div class="bar"><div class="fill" id="mfill"></div></div>
      <div class="scale"><span id="mstart"></span><span id="mgoal"></span></div>
      <div class="stats">
        <div><b id="sscore">0</b>correct</div>
        <div><b id="sstreak">0</b>streak</div>
        <div><b id="sleft">0</b>to go</div>
      </div>
      <div class="badges" id="badges"></div>
    </aside>
    <main class="panel" id="main">
      <section id="start">
        <p id="tagline" style="font-size:1.1rem;margin-top:0"></p>
        <div class="intro-cards" id="roundcards"></div>
        <label for="pname"><b>Your name</b> (for your certificate)</label>
        <input id="pname" class="name" maxlength="40" placeholder="First name and last initial" autocomplete="off">
        <div class="actions"><button class="btn" id="go">Start</button></div>
        <p class="kbd">Tip: press 1 to 4 (or T / F) to answer, Enter for next.</p>
      </section>
      <section id="play" class="hidden">
        <span class="roundtag" id="rtag"></span><span class="count" id="qcount"></span>
        <div class="progress"><span id="pbar"></span></div>
        <div class="q" id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div class="fb" id="fb" role="status"></div>
        <div class="actions"><button class="btn hidden" id="next">Next</button></div>
      </section>
      <section id="end" class="hidden">
        <h2 id="endhead" style="margin-top:0"></h2>
        <p id="endmsg"></p>
        <div class="actions">
          <button class="btn" id="showcert">Show certificate</button>
          <button class="btn alt" id="redo">Redo mistakes</button>
          <button class="btn alt" id="again">Play again</button>
        </div>
        <div class="review" id="review"></div>
        <div class="cert" id="cert">
          <div style="color:var(--grey)">Year 10 Geography</div>
          <h2 id="certtitle"></h2>
          <p>This certifies that</p>
          <div class="big" id="certname"></div>
          <p id="certline"></p>
          <p style="color:var(--grey);font-size:.85rem" id="certdate"></p>
          <div class="actions" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button></div>
        </div>
      </section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = {"id":"L12","label":"L12","title":"Does aid actually work?","date":"Fri 30 Oct","game":{"title":"Aid Audit","tagline":"Every right answer sends help to the right place. Can you lift Pacific wellbeing to 90%?","meter":{"label":"Pacific wellbeing","start":40,"goal":90,"unit":"%","decimals":0},"rounds":[{"name":"Rapid recall","desc":"Aid basics plus earlier lessons","kind":"mcq","questions":[{"q":"What does ODA stand for?","options":["Overseas Disaster Assistance","Official Development Assistance","Organised Donor Aid","Open Development Account"],"answer":1,"why":"ODA is government aid that meets the OECD rules for development."},{"q":"What share of national income is the UN target for aid from rich countries?","options":["0.19%","7%","0.7%","1.9%"],"answer":2,"why":"The target is 0.7% of gross national income. Australia gives about 0.19%."},{"q":"About how big is Australia's aid budget for 2026-27?","options":["$5.2 billion","$52 million","$520 billion","$2.2 million"],"answer":0,"why":"About $5.2 billion, with about $2.2 billion going to the Pacific."},{"q":"Which region gets about 75% of Australian aid?","options":["Africa","Latin America","Europe","The Indo-Pacific"],"answer":3,"why":"Most Australian aid stays in our own region, the Indo-Pacific."},{"q":"Which project built raised, storm-safe land in Tuvalu?","options":["PALM","Jal Jeevan Mission","TCAP","PM POSHAN"],"answer":2,"why":"The Tuvalu Coastal Adaptation Project built 7.3 hectares, plus about 8 more by Oct 2025."},{"q":"Money a worker sends home to family is called:","options":["A remittance","A tariff","Tied aid","A grant"],"answer":0,"why":"PALM workers send remittances home to pay for food, school and housing."},{"q":"L7: which tool is the UN using when it tracks SDG targets?","options":["Fund","Deliver","Change rules","Measure"],"answer":3,"why":"The UN mostly measures and reports. It cannot force countries to act."},{"q":"L7: what is the last box of the impact chain?","options":["Evidence","Weak spot","Wellbeing change","Who"],"answer":1,"why":"WHO, TYPE, DID WHAT, WELLBEING CHANGE, EVIDENCE, WEAK SPOT."},{"q":"Unit 1: building raised land against rising seas is an example of:","options":["Mitigation","Land clearing","Adaptation","A sink function"],"answer":2,"why":"Adaptation means adjusting to live with climate change."},{"q":"L10: Australia's HDI of about 0.958 puts it in which category?","options":["Very high","High","Medium","Low"],"answer":0,"why":"Very high starts at 0.800. Australia is about 7th in the world."}]},{"name":"Who gives it?","desc":"Bilateral, multilateral or NGO?","kind":"sort","buckets":["Bilateral","Multilateral","NGO"],"questions":[{"q":"Australia pays Papua New Guinea's government to upgrade a hospital","answer":0,"why":"One government directly to another."},{"q":"Many countries pool money in the Green Climate Fund","answer":1,"why":"Pooled through an international fund."},{"q":"Red Cross volunteers hand out water after a flood","answer":2,"why":"Red Cross is a non-government organisation."},{"q":"Australia gives money to the World Bank for projects in Africa","answer":1,"why":"The World Bank decides where the pooled money goes."},{"q":"New Zealand funds Tonga's government to repair roads","answer":0,"why":"Government to government."},{"q":"Oxfam runs a water project funded by public donations","answer":2,"why":"An NGO funded by donations."},{"q":"UNICEF buys vaccines with money from dozens of countries","answer":1,"why":"UNICEF is part of the UN, so the money is multilateral."},{"q":"The Indigenous Literacy Foundation gifts books to remote communities","answer":2,"why":"ILF is an Australian NGO."}]},{"name":"True or false","desc":"Spot the aid myths","kind":"tf","questions":[{"q":"All aid is ODA.","answer":false,"why":"Donations to charities are aid but not ODA. ODA comes from governments."},{"q":"Emergency aid is short-term help after a disaster.","answer":true,"why":"It saves lives in the weeks after a crisis."},{"q":"Tied aid always gives the recipient the best value.","answer":false,"why":"It forces spending with donor companies, often skipping cheaper local options."},{"q":"Bottom-up projects start with what the community wants.","answer":true,"why":"Local people decide and run them."},{"q":"Dependency means a place builds strong systems of its own.","answer":false,"why":"Dependency is the opposite: relying on aid instead of building local systems."},{"q":"PALM workers can work in Australian aged care.","answer":true,"why":"PALM jobs include farms, meat works and aged care."},{"q":"Australia gives more than the UN's 0.7% target.","answer":false,"why":"Australia gives about 0.19% of national income."},{"q":"TCAP's new land is designed to stay above projected sea levels beyond 2100.","answer":true,"why":"That is the design goal of the raised land on Funafuti."}]},{"name":"Short or long?","desc":"Emergency or development aid?","kind":"sort","buckets":["Emergency","Development"],"questions":[{"q":"Tents flown in two days after a cyclone","answer":0,"why":"Immediate, short-term relief."},{"q":"A 10-year program to train teachers","answer":1,"why":"Builds lasting systems."},{"q":"Raising land in Tuvalu above future sea levels","answer":1,"why":"Planned years ahead, long-term adaptation."},{"q":"Food parcels for families fleeing a war","answer":0,"why":"Life-saving help during a crisis."},{"q":"Building a rural clinic and training local nurses","answer":1,"why":"Permanent health services."},{"q":"Water purifying tablets after an earthquake","answer":0,"why":"Short-term, stops disease straight after a disaster."}]}]}};
const G = D.game, M = G.meter;
const $ = (id) => document.getElementById(id);
let redo = false, fixed = 0, redoTotal = 0, queue = [], qi = 0, score = 0, streak = 0, best = 0, wrong = [], answered = false, meter = M.start, roundDone = {};
const all = []; G.rounds.forEach((r, ri) => r.questions.forEach((q, qn) => all.push({ ...q, ri, kind: r.kind, buckets: r.buckets })));
const step = (M.goal - M.start) / all.length;
const fmt = (v) => (M.decimals ? v.toFixed(M.decimals) : Math.round(v)) + (M.unit || "");
$("gtitle").textContent = G.title;
$("gsub").textContent = "Year 10 Geography | " + D.label + " " + D.title;
$("tagline").textContent = G.tagline;
$("mlabel").textContent = M.label;
$("mstart").textContent = fmt(M.start); $("mgoal").textContent = "Goal " + fmt(M.goal);
G.rounds.forEach((r, i) => {
  const c = document.createElement("div"); c.className = "ic";
  c.innerHTML = "<b></b><small></small>"; c.querySelector("b").textContent = (i + 1) + ". " + r.name;
  c.querySelector("small").textContent = r.desc + " (" + r.questions.length + " questions)"; $("roundcards").appendChild(c);
  const b = document.createElement("span"); b.className = "badge"; b.id = "badge" + i; b.textContent = r.name; $("badges").appendChild(b);
});
try { $("pname").value = localStorage.getItem("geo10-name") || ""; } catch (e) {}
function drawMeter() {
  $("mval").textContent = fmt(meter);
  $("mfill").style.width = Math.max(0, Math.min(100, ((meter - M.start) / (M.goal - M.start)) * 100)) + "%";
  $("sscore").textContent = score; $("sstreak").textContent = streak; $("sleft").textContent = queue.length ? queue.length - qi : all.length;
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }
function start(list) {
  queue = list; qi = 0; answered = false; wrong = [];
  $("start").classList.add("hidden"); $("end").classList.add("hidden"); $("play").classList.remove("hidden"); $("cert").style.display = "none";
  show();
}
function show() {
  const q = queue[qi]; answered = false;
  $("rtag").textContent = "Round " + (q.ri + 1) + ": " + G.rounds[q.ri].name;
  $("qcount").textContent = (qi + 1) + " / " + queue.length;
  $("pbar").style.width = (qi / queue.length) * 100 + "%";
  $("qtext").textContent = q.kind === "sort" ? "Sort it: " + q.q : q.q;
  const box = $("opts"); box.innerHTML = ""; box.className = "opts" + (q.kind === "tf" ? " tf" : "");
  const opts = q.kind === "tf" ? ["True", "False"] : q.kind === "sort" ? q.buckets : q.options;
  opts.forEach((o, i) => {
    const b = document.createElement("button"); b.className = "opt";
    b.innerHTML = '<span class="k"></span><span></span>';
    b.querySelector(".k").textContent = q.kind === "tf" ? (i ? "F" : "T") : i + 1;
    b.lastChild.textContent = o; b.onclick = () => pick(i); box.appendChild(b);
  });
  $("fb").className = "fb"; $("next").classList.add("hidden"); drawMeter();
  box.firstChild.focus({ preventScroll: true });
}
function correctIndex(q) { return q.kind === "tf" ? (q.answer ? 0 : 1) : q.answer; }
function pick(i) {
  if (answered) return; answered = true;
  const q = queue[qi], c = correctIndex(q), btns = [...$("opts").children];
  btns.forEach((b, j) => { b.disabled = true; if (j === c) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
  const fb = $("fb"), ok = i === c, ans = btns[c].lastChild.textContent;
  fb.innerHTML = "<b></b><span></span>";
  if (ok) {
    if (redo) fixed++; else { score++; meter = Math.min(M.goal, meter + step); } streak++; best = Math.max(best, streak);
    fb.className = "fb show good"; fb.querySelector("b").textContent = streak >= 3 ? "Correct! " + streak + " in a row" : "Correct!";
    if (streak === 5 || streak === 10) toast(streak + " in a row. On fire.");
  } else {
    streak = 0; wrong.push(q);
    fb.className = "fb show badfb"; fb.querySelector("b").textContent = "Not quite. Answer: " + ans;
  }
  fb.querySelector("span").textContent = q.why || "";
  const last = qi === queue.length - 1 || queue[qi + 1].ri !== q.ri;
  if (last && !roundDone[q.ri]) { roundDone[q.ri] = 1; $("badge" + q.ri).classList.add("got"); toast("Round complete: " + G.rounds[q.ri].name); }
  $("next").textContent = qi === queue.length - 1 ? "See results" : "Next";
  $("next").classList.remove("hidden"); $("next").focus({ preventScroll: true }); drawMeter();
}
function next() { if (!answered) return; qi++; if (qi >= queue.length) return finish(); show(); }
function finish() {
  $("play").classList.add("hidden"); $("end").classList.remove("hidden"); $("pbar").style.width = "100%";
  const pct = Math.round((score / all.length) * 100);
  $("endhead").textContent = meter >= M.goal - 1e-9 ? "Goal reached!" : "Finished!";
 if (redo) { $("endhead").textContent = "Mistakes redone"; } $("endmsg").textContent = (redo ? "You fixed " + fixed + " of " + redoTotal + " mistakes. Original score: " : "You got ") + score + " of " + all.length + " (" + pct + "%). Best streak: " + best + ". " + M.label + ": " + fmt(meter) + ".";
  const rv = $("review"); rv.innerHTML = "";
  if (wrong.length) {
    const h = document.createElement("h3"); h.textContent = "Mistake review (" + wrong.length + ")"; rv.appendChild(h);
    wrong.forEach((q) => {
      const d = document.createElement("div"); d.className = "item";
      const opts = q.kind === "tf" ? ["True", "False"] : q.kind === "sort" ? q.buckets : q.options;
      d.innerHTML = "<div></div><div class='ans'></div><div style='color:var(--grey)'></div>";
      d.children[0].textContent = q.q; d.children[1].textContent = "Answer: " + opts[correctIndex(q)]; d.children[2].textContent = q.why || "";
      rv.appendChild(d);
    });
  } else { rv.innerHTML = "<p><b>Perfect run. No mistakes to review.</b></p>"; }
  $("redo").classList.toggle("hidden", !wrong.length);
  const name = $("pname").value.trim() || "A Year 10 geographer";
  $("certtitle").textContent = G.title; $("certname").textContent = name;
  $("certline").textContent = "scored " + score + " / " + all.length + " (" + pct + "%) in " + D.label + " " + D.title;
  $("certdate").textContent = new Date().toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" });
}
$("go").onclick = () => { redo = false; try { localStorage.setItem("geo10-name", $("pname").value.trim()); } catch (e) {} score = 0; streak = 0; best = 0; meter = M.start; roundDone = {}; document.querySelectorAll(".badge").forEach((b) => b.classList.remove("got")); start(all.slice()); };
$("next").onclick = next;
$("again").onclick = () => $("go").onclick();
$("redo").onclick = () => { const w = wrong.slice(); redo = true; fixed = 0; redoTotal = w.length; start(w); };
$("showcert").onclick = () => { $("cert").style.display = "block"; $("cert").scrollIntoView({ behavior: "smooth" }); };
document.addEventListener("keydown", (e) => {
  if ($("play").classList.contains("hidden") || e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase(), q = queue[qi];
  if (k === "enter" && answered) { e.preventDefault(); next(); return; }
  if (q.kind === "tf" && (k === "t" || k === "f")) pick(k === "t" ? 0 : 1);
  else if (/^[1-4]$/.test(k)) { const n = +k - 1; if (n < $("opts").children.length) pick(n); }
});
drawMeter();
</script>
</body>
</html>
