<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy - Lesson 36 - Ecological importance of the Amazon</title>
<style>
:root{
  --accent:#1E7A4E;
  --accent2:#C08A2E;
  --ink:#12291E;
  --grey:#5A6660;
  --mist:#EAF1EA;
  --line:#D6E2D6;
  --good:#1E7A4E;
  --bad:#C0442F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#F7FAF7;color:var(--ink);line-height:1.5;padding:16px}
.wrap{max-width:860px;margin:0 auto}
header{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
header h1{font-size:26px;letter-spacing:-.4px}
header p{color:var(--grey);font-size:14px;margin-top:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--mist);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.stat span{color:var(--accent);font-weight:700}
.gauge{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px;margin-bottom:14px}
.gauge .lab{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--grey);font-weight:700}
.gauge .val{font-size:30px;font-weight:800;color:var(--accent);margin:2px 0 8px}
.track{position:relative;height:16px;background:#E4EAE4;border-radius:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .45s ease}
.mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad)}
.gauge .note{font-size:12px;color:var(--grey);margin-top:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:14px}
.round{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent2);font-weight:800}
.prompt{font-size:20px;font-weight:700;margin:8px 0 18px;line-height:1.35}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font-size:15.5px;
  font-family:inherit;color:var(--ink);transition:.14s;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:#FAFDFA}
.opt:disabled{cursor:default}
.key{flex:none;width:25px;height:25px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.right{border-color:var(--good);background:#E9F4EE}
.opt.right .key{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:#FBEAE7}
.opt.wrong .key{background:var(--bad)}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:#E9F4EE;border-left:4px solid var(--good)}
.fb.no{background:#FBEAE7;border-left:4px solid var(--bad)}
.fb b{display:block;margin-bottom:3px}
button.go{margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:9px;
  padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button.go:hover{opacity:.9}
button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-top:14px}
.badge{border:1.5px dashed var(--line);border-radius:10px;padding:11px;font-size:12.5px;color:#B4BDB6}
.badge.won{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--mist)}
.badge b{display:block;font-size:13.5px;margin-bottom:2px}
.miss{border-left:3px solid var(--bad);padding:9px 13px;margin-bottom:9px;background:#FDF6F5;
  border-radius:0 8px 8px 0;font-size:14px}
.miss .qq{font-weight:600}
.miss .aa{color:var(--good);font-size:13px;margin-top:3px}
.hint{font-size:12.5px;color:var(--grey);margin-top:12px}
.big{font-size:44px;font-weight:800;color:var(--accent);line-height:1.1}
@media print{
  body{background:#fff}
  .noprint{display:none !important}
  .cert{border:4px double var(--accent);padding:40px;text-align:center}
}
.cert{display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Canopy</h1>
  <p>Lesson 36 - Ecological importance of the Amazon</p>
  <div class="bar">
    <div class="stat">Round <span id="sRound">1</span> of 4</div>
    <div class="stat">Question <span id="sQ">1</span></div>
    <div class="stat">Score <span id="sScore">0</span></div>
    <div class="stat">Streak <span id="sStreak">0</span></div>
  </div>
</header>

<div class="gauge noprint">
  <div class="lab">Tree species logged in this hectare</div>
  <div class="val" id="gVal">-</div>
  <div class="track"><div class="fill" id="gFill"></div><div class="mark" id="gMark" style="display:none"></div></div>
  <div class="note">A single Amazon hectare can hold more than 500 tree species. Log them all.</div>
</div>

<div class="card" id="stage"></div>

<div class="cert" id="cert"></div>
</div>

<script>
const CFG = {"slug":"lesson-36","file":"Lesson36_Canopy_Activity.html","title":"Canopy","subtitle":"Lesson 36 - Ecological importance of the Amazon","accent":"#1E7A4E","accent2":"#C08A2E","gauge":"species","gaugeLabel":"Tree species logged in this hectare","gaugeTarget":500,"gaugeNote":"A single Amazon hectare can hold more than 500 tree species. Log them all.","badges":[["Understorey","Finish Round 1"],["Canopy","Finish Round 2"],["Emergent","Finish Round 3"],["Full survey","Finish all four rounds"],["Streak of five","Get five right in a row"],["Clean sweep","Finish a round with no mistakes"]],"rounds":[{"name":"Rapid Recall","blurb":"Last week and today. Ten quick ones.","q":[["An environmental worldview is best described as...",["The beliefs and values that shape how a person relates to the environment","A law about protecting the environment","A scientific measurement of pollution","A type of national park"],0,"It is about values and beliefs, not rules or measurements."],["Which government tool sets a maximum amount that can be taken or released?",["LIMITS","LAWS","PENALTIES","CONDITIONS"],0,"LIMITS cap the quantity. LAWS make it illegal, CONDITIONS attach requirements, PENALTIES punish breaches."],["Industry asks two questions first. They are...",["Does it make money, and does it break the rules?","Is it popular, and is it fair?","Is it legal, and is it traditional?","Does it help wildlife, and does it help people?"],0,"Profit and compliance. Reputation comes third."],["Roughly how large is the Amazon rainforest?",["About 5.5 million square kilometres","About 550,000 square kilometres","About 55 million square kilometres","About 1.2 million square kilometres"],0,"About 5.5 million km2, roughly 70 per cent of the size of Australia."],["How many countries share the Amazon basin?",["9","3","15","1"],0,"Nine countries, which means no single government controls it."],["\"The Amazon produces 20 per cent of the world's oxygen.\" This claim is...",["A myth. The forest uses almost all the oxygen it makes, so its net contribution is close to zero","Correct, and that is why it is called the lungs of the planet","An underestimate. The real figure is closer to 40 per cent","Correct only during the wet season"],0,"Plants release oxygen by day and use it by night, and decomposition uses more. Net contribution is near zero."],["The three real reasons the Amazon matters globally are...",["Biodiversity, carbon storage and the water cycle","Oxygen, timber and tourism","Rainfall, rivers and fish","Medicine, mining and farmland"],0,"Biodiversity, carbon, water. These are the three headings for the whole case study."],["Roughly what share of all known species live in the Amazon?",["At least 10 per cent","About 1 per cent","About 40 per cent","About 75 per cent"],0,"At least one in every ten known species on Earth."],["Evapotranspiration means...",["Water taken up by plants and released into the air as vapour","Water running off the land into rivers","Water soaking down into groundwater","Water freezing in the upper atmosphere"],0,"Evaporation plus transpiration. It is how the forest puts water back into the air."],["Storing carbon is which environmental function?",["Sink","Source","Service","Spiritual"],0,"A sink absorbs and holds something. A source provides materials."]]},{"name":"Function Sort","blurb":"Source, sink, service or spiritual. Week 1 is still working for you.","opts":["Source","Sink","Service","Spiritual"],"q":[["Brazil nuts harvested from the forest and sold",null,0,"The forest is providing a material. That is a source."],["90 to 200 billion tonnes of carbon locked in trunks, roots and soil",null,1,"Absorbing and holding carbon is the classic sink."],["Flying rivers delivering rain to farms 2,000 km away",null,2,"The forest is doing a job for people, for free, at a distance. Service."],["Sacred sites of Amazonian Indigenous peoples",null,3,"Cultural and spiritual value. It cannot be rebuilt."],["Timber cut and milled for construction",null,0,"A material taken out of the environment. Source."],["The forest absorbing about 1.2 billion tonnes of carbon each year",null,1,"Taking carbon out of the atmosphere and holding it. Sink."],["Tree roots holding soil in place during heavy rain",null,2,"Erosion control is a service the environment performs."],["Medicines developed from rainforest plants",null,0,"The forest supplies the raw material. Source."],["Ancestral homeland of hundreds of Indigenous groups",null,3,"Spiritual and cultural connection to Country."],["Rainfall recycling that keeps the western Amazon wet",null,2,"A process the environment performs that people benefit from. Service."]]},{"name":"Figure File","blurb":"Numbers you can quote on Friday. Get them exact.","q":[["Area of the Amazon rainforest",["About 5.5 million km2","About 2.5 million km2","About 9.1 million km2","About 800,000 km2"],0,"5.5 million km2, the largest tropical rainforest on Earth."],["Approximate number of trees in the Amazon",["About 390 billion","About 39 billion","About 3.9 billion","About 3.9 trillion"],0,"Roughly 390 billion trees."],["Carbon stored in the Amazon",["An estimated 90 to 200 billion tonnes","About 5 billion tonnes","About 1,500 billion tonnes","About 900 million tonnes"],0,"Estimates vary by source. Quote the range and name your source."],["Carbon absorbed by the Amazon each year",["About 1.2 billion tonnes","About 12 billion tonnes","About 120 million tonnes","About 60 billion tonnes"],0,"Roughly 1.2 billion tonnes of carbon a year."],["Moisture the Amazon releases into the air each day",["About 20 billion tonnes","About 200 million tonnes","About 2 billion tonnes","About 500 billion tonnes"],0,"About 20 billion tonnes daily, more than the river discharges to the sea."],["Share of Amazon rainfall that is recycled by the forest",["At least 75 per cent","About 25 per cent","About 5 per cent","About 99 per cent"],0,"At least 75 per cent, cycling five or six times before reaching the Andes."],["Tree species possible in a single Amazon hectare",["More than 500","About 50","About 5","About 5,000"],0,"More than 500 in one hectare. All of Europe has about 250."],["Share of their annual rainfall that south-western Amazon forests get from flying rivers",["More than 70 per cent","About 20 per cent","About 5 per cent","About 100 per cent"],0,"More than 70 per cent, which is why clearing in the east matters in the west."],["Estimated number of insect species in the Amazon",["About 2.5 million, most never described","About 25,000","About 250","About 250 million"],0,"An estimate, not a count. Most have never been formally described."]]},{"name":"Myth or Fact","blurb":"Nine claims. Which ones survive contact with the evidence?","opts":["Myth","Fact"],"q":[["The Amazon is the lungs of the planet, producing 20 per cent of the world's oxygen.",null,0,"Myth. The forest consumes almost all the oxygen it produces."],["Parts of the Brazilian Amazon now release more carbon than they absorb.",null,1,"Fact. Clearing and fire have flipped some areas from sink to source."],["A flying river is a river that floods across the forest floor in the wet season.",null,0,"Myth. A flying river is moisture moving through the air, not water on the ground."],["A single Amazon river may contain more fish species than all of Europe's rivers combined.",null,1,"Fact. The scale of Amazon biodiversity is genuinely hard to picture."],["All nine Amazon countries are governed by one shared environmental law.",null,0,"Myth. Nine separate governments, nine sets of rules."],["Sources disagree on Amazon carbon figures because they use different boundaries, methods and dates.",null,1,"Fact. That is why you quote a range and name your source."],["The Amazon generates a large share of its own rainfall.",null,1,"Fact. At least 75 per cent of its rainfall is recycled by the forest itself."],["The Amazon River runs about 6,400 km from source to sea.",null,1,"Fact. One of the two longest rivers in the world."],["Clearing forest in the eastern Amazon has no effect on rainfall in the west.",null,0,"Myth. Break the recycling chain in the middle and the rain never reaches the far end."]]}]};

let ri=0, qi=0, score=0, streak=0, best=0, roundErrors=0, misses=[], won={}, answered=false;
let gauge = CFG.gauge==='cover' ? CFG.gaugeStart : 0;

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LETTERS=['A','B','C','D','E','F'];

function total(){return CFG.rounds.reduce((n,r)=>n+r.q.length,0);}

function drawGauge(){
  if(CFG.gauge==='cover'){
    $('gVal').textContent=gauge.toFixed(1)+'%';
    $('gFill').style.width=gauge+'%';
    $('gMark').style.display='block';
    $('gMark').style.left=CFG.gaugeFloor+'%';
    $('gVal').style.color = gauge<CFG.gaugeFloor ? 'var(--bad)' : 'var(--accent)';
  }else{
    $('gVal').textContent=Math.round(gauge)+' / '+CFG.gaugeTarget;
    $('gFill').style.width=Math.min(100,(gauge/CFG.gaugeTarget)*100)+'%';
  }
}

function stats(){
  $('sRound').textContent=ri+1;
  $('sQ').textContent=qi+1;
  $('sScore').textContent=score;
  $('sStreak').textContent=streak;
}

function question(){
  const R=CFG.rounds[ri], item=R.q[qi];
  const rawOpts = item[1] ? item[1] : R.opts;
  const correctText = rawOpts[item[2]];
  const opts = shuffle(rawOpts);
  answered=false;
  stats(); drawGauge();

  $('stage').innerHTML =
    '<div class="round">Round '+(ri+1)+' &middot; '+R.name+'</div>'+
    '<div class="prompt">'+item[0]+'</div>'+
    '<div class="opts" id="opts"></div>'+
    '<div class="fb" id="fb"></div>'+
    '<div class="hint noprint">Tap an answer, or press '+LETTERS.slice(0,opts.length).join(', ')+' on a keyboard.</div>';

  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.dataset.i=i;
    b.innerHTML='<span class="key">'+LETTERS[i]+'</span><span>'+o+'</span>';
    b.onclick=()=>choose(i,o,correctText,item[3],opts);
    $('opts').appendChild(b);
  });
}

function choose(i,picked,correctText,why,opts){
  if(answered) return;
  answered=true;
  const right = picked===correctText;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(opts[j]===correctText) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
  });

  if(right){
    streak++; best=Math.max(best,streak);
    const bonus = streak>=5 ? 20 : streak>=3 ? 15 : 10;
    score+=bonus;
    if(CFG.gauge==='cover') gauge=Math.min(CFG.gaugeStart, gauge+0.4);
    else gauge+=CFG.gaugeTarget/total();
    if(streak>=5) won['Streak of five']=true;
    $('fb').className='fb ok show';
    $('fb').innerHTML='<b>Correct. +'+bonus+(streak>=3?' (streak bonus)':'')+'</b>'+why;
  }else{
    streak=0; roundErrors++;
    if(CFG.gauge==='cover') gauge=Math.max(0,gauge-1.2);
    misses.push({q:CFG.rounds[ri].q[qi][0], a:correctText, why:why});
    $('fb').className='fb no show';
    $('fb').innerHTML='<b>Not this time. The answer is: '+correctText+'</b>'+why;
  }

  const b=document.createElement('button');
  b.className='go'; b.textContent='Next';
  b.onclick=next;
  $('fb').appendChild(b);
  stats(); drawGauge();
}

function next(){
  qi++;
  if(qi<CFG.rounds[ri].q.length){ question(); return; }
  if(roundErrors===0) won['Clean sweep']=true;
  won[CFG.badges[Math.min(ri,2)][0]]=true;
  roundEnd();
}

function roundEnd(){
  const last = ri===CFG.rounds.length-1;
  if(last){ won['Full survey']=true; if(CFG.gauge==='cover'&&gauge>=CFG.gaugeFloor) won['Above the line']=true; }
  $('stage').innerHTML=
    '<div class="round">Round '+(ri+1)+' complete</div>'+
    '<div class="big">'+score+'</div>'+
    '<p style="color:var(--grey);margin-top:6px">'+
      (roundErrors===0?'Clean sweep. No mistakes at all.':roundErrors+' to review at the end.')+'</p>'+
    '<button class="go" id="nx">'+(last?'See your results':'Start Round '+(ri+2)+': '+CFG.rounds[ri+1].name)+'</button>'+
    (last?'':'<p class="hint">'+CFG.rounds[ri+1].blurb+'</p>');
  $('nx').onclick=()=>{ if(last){results();} else {ri++;qi=0;roundErrors=0;question();} };
}

function results(){
  const t=total(), max=t*10;
  let html='<div class="round">Finished</div><div class="big">'+score+'</div>'+
    '<p style="color:var(--grey);margin-top:6px">'+(t-misses.length)+' of '+t+
    ' correct. Longest streak: '+best+'. Base score out of '+max+', streak bonuses on top.</p>';

  html+='<h3 style="margin:22px 0 4px;font-size:17px">Badges</h3><div class="badges">';
  CFG.badges.forEach(b=>{
    html+='<div class="badge'+(won[b[0]]?' won':'')+'"><b>'+b[0]+'</b>'+b[1]+'</div>';
  });
  html+='</div>';

  if(misses.length){
    html+='<h3 style="margin:22px 0 8px;font-size:17px">Worth another look</h3>';
    misses.forEach(m=>{
      html+='<div class="miss"><div class="qq">'+m.q+'</div><div class="aa">'+m.a+' &mdash; '+m.why+'</div></div>';
    });
  }else{
    html+='<p style="margin-top:20px;color:var(--good);font-weight:700">Nothing to review. Every single one correct.</p>';
  }

  html+='<div class="noprint"><button class="go" id="pr">Print certificate</button>'+
        '<button class="go ghost" id="rs" style="margin-left:8px">Play again</button></div>';
  $('stage').innerHTML=html;

  $('pr').onclick=()=>{
    $('cert').innerHTML=
      '<h1 style="font-size:30px">'+CFG.title+'</h1>'+
      '<p style="color:#5A6660;margin-bottom:20px">'+CFG.subtitle+'</p>'+
      '<p style="font-size:16px">This certifies that</p>'+
      '<p style="border-bottom:1px solid #999;width:70%;margin:22px auto;height:34px"></p>'+
      '<p style="font-size:16px">scored</p>'+
      '<p style="font-size:52px;font-weight:800;color:'+CFG.accent+'">'+score+'</p>'+
      '<p style="font-size:15px">'+(t-misses.length)+' of '+t+' correct, longest streak '+best+'</p>'+
      '<p style="margin-top:26px;font-size:13px;color:#5A6660">Year 10 Geography &middot; Environmental Change and Management</p>';
    $('cert').style.display='block';
    window.print();
    setTimeout(()=>{$('cert').style.display='none';},400);
  };
  $('rs').onclick=()=>location.reload();
}

document.addEventListener('keydown',e=>{
  if(answered) return;
  const k=LETTERS.indexOf(e.key.toUpperCase());
  if(k>-1){ const b=document.querySelectorAll('.opt')[k]; if(b) b.click(); }
});

// intro
$('stage').innerHTML=
  '<div class="round">Before you start</div>'+
  '<div class="prompt">'+CFG.rounds.length+' rounds, '+total()+' questions.</div>'+
  '<p style="color:var(--grey)">Answers are shuffled every time, so learn the content, not the position. '+
  'Three in a row is worth 15, five in a row is worth 20. Everything you get wrong is saved for review at the end.</p>'+
  '<button class="go" id="st">Start Round 1: '+CFG.rounds[0].name+'</button>'+
  '<p class="hint">'+CFG.rounds[0].blurb+'</p>';
$('st').onclick=question;
drawGauge();
</script>
</body>
</html>
