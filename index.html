<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier - Lesson 37 - Deforestation and agriculture</title>
<style>
:root{
  --accent:#C0442F;
  --accent2:#C08A2E;
  --ink:#12291E;
  --grey:#5A6660;
  --mist:#EAF1EA;
  --line:#D6E2D6;
  --good:#1E7A4E;
  --bad:#C0442F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#F7FAF7;color:var(--ink);line-height:1.5;padding:16px}
.wrap{max-width:860px;margin:0 auto}
header{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
header h1{font-size:26px;letter-spacing:-.4px}
header p{color:var(--grey);font-size:14px;margin-top:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--mist);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.stat span{color:var(--accent);font-weight:700}
.gauge{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px;margin-bottom:14px}
.gauge .lab{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--grey);font-weight:700}
.gauge .val{font-size:30px;font-weight:800;color:var(--accent);margin:2px 0 8px}
.track{position:relative;height:16px;background:#E4EAE4;border-radius:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .45s ease}
.mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad)}
.gauge .note{font-size:12px;color:var(--grey);margin-top:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:14px}
.round{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent2);font-weight:800}
.prompt{font-size:20px;font-weight:700;margin:8px 0 18px;line-height:1.35}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font-size:15.5px;
  font-family:inherit;color:var(--ink);transition:.14s;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:#FAFDFA}
.opt:disabled{cursor:default}
.key{flex:none;width:25px;height:25px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.right{border-color:var(--good);background:#E9F4EE}
.opt.right .key{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:#FBEAE7}
.opt.wrong .key{background:var(--bad)}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:#E9F4EE;border-left:4px solid var(--good)}
.fb.no{background:#FBEAE7;border-left:4px solid var(--bad)}
.fb b{display:block;margin-bottom:3px}
button.go{margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:9px;
  padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button.go:hover{opacity:.9}
button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-top:14px}
.badge{border:1.5px dashed var(--line);border-radius:10px;padding:11px;font-size:12.5px;color:#B4BDB6}
.badge.won{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--mist)}
.badge b{display:block;font-size:13.5px;margin-bottom:2px}
.miss{border-left:3px solid var(--bad);padding:9px 13px;margin-bottom:9px;background:#FDF6F5;
  border-radius:0 8px 8px 0;font-size:14px}
.miss .qq{font-weight:600}
.miss .aa{color:var(--good);font-size:13px;margin-top:3px}
.hint{font-size:12.5px;color:var(--grey);margin-top:12px}
.big{font-size:44px;font-weight:800;color:var(--accent);line-height:1.1}
@media print{
  body{background:#fff}
  .noprint{display:none !important}
  .cert{border:4px double var(--accent);padding:40px;text-align:center}
}
.cert{display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Frontier</h1>
  <p>Lesson 37 - Deforestation and agriculture</p>
  <div class="bar">
    <div class="stat">Round <span id="sRound">1</span> of 4</div>
    <div class="stat">Question <span id="sQ">1</span></div>
    <div class="stat">Score <span id="sScore">0</span></div>
    <div class="stat">Streak <span id="sStreak">0</span></div>
  </div>
</header>

<div class="gauge noprint">
  <div class="lab">Forest cover remaining</div>
  <div class="val" id="gVal">-</div>
  <div class="track"><div class="fill" id="gFill"></div><div class="mark" id="gMark" style="display:none"></div></div>
  <div class="note">You start at 86.8 per cent, where the Amazon is today. The red line at 75 per cent is the tipping-point danger zone. Wrong answers clear forest.</div>
</div>

<div class="card" id="stage"></div>

<div class="cert" id="cert"></div>
</div>

<script>
const CFG = {"slug":"lesson-37","file":"Lesson37_Frontier_Activity.html","title":"Frontier","subtitle":"Lesson 37 - Deforestation and agriculture","accent":"#C0442F","accent2":"#C08A2E","gauge":"cover","gaugeLabel":"Forest cover remaining","gaugeStart":86.8,"gaugeFloor":75,"gaugeNote":"You start at 86.8 per cent, where the Amazon is today. The red line at 75 per cent is the tipping-point danger zone. Wrong answers clear forest.","badges":[["Frontier scout","Finish Round 1"],["Driver spotter","Finish Round 2"],["Figure keeper","Finish Round 3"],["Full survey","Finish all four rounds"],["Streak of five","Get five right in a row"],["Above the line","Finish with cover still above 75 per cent"]],"rounds":[{"name":"Rapid Recall","blurb":"Yesterday and today. Ten quick ones.","q":[["The three reasons the Amazon matters globally are...",["Biodiversity, carbon storage and the water cycle","Oxygen, timber and tourism","Fish, gold and farmland","Rainfall, rivers and roads"],0,"Same three headings as Lesson 36."],["Storing carbon is which environmental function?",["Sink","Source","Service","Spiritual"],0,"A sink absorbs and holds."],["A flying river is...",["Moisture carried across the basin in the air and recycled by trees","A river that changes course each wet season","An underground river beneath the forest","A river used to transport logs"],0,"Moisture highways in the sky, running east to west."],["The single biggest driver of Amazon deforestation is...",["Cattle ranching","Soy farming","Gold mining","Selective logging"],0,"Cattle, by a long way."],["Roughly what share of Brazil's deforestation is driven by cattle?",["About 72 per cent","About 22 per cent","About 95 per cent","About 40 per cent"],0,"Around 72 per cent of Brazil's deforestation."],["Roughly what share of the original Amazon has already been cleared?",["About 13.2 per cent","About 45 per cent","About 2 per cent","About 60 per cent"],0,"About 13.2 per cent overall, but 31 per cent in the eastern Amazon."],["How much Amazon forest was cleared in the year to July 2025?",["5,796 km2","57,960 km2","579 km2","15,796 km2"],0,"5,796 km2, down 11 per cent and the lowest in 11 years."],["Degradation means...",["The forest is damaged but still standing","The forest has been completely removed","The forest is legally protected","The forest is being replanted"],0,"Burnt, thinned or dried out, but still there. Mostly not counted in official figures."],["The fishbone effect describes...",["Side tracks branching off a new road, multiplying clearing","Fish species disappearing from Amazon rivers","The shape of the Amazon river system","Soil erosion patterns after clearing"],0,"From the air the pattern looks like a fish skeleton."],["A tipping point is...",["A threshold past which change becomes self-sustaining and very hard to reverse","The moment deforestation stops","The point where a forest is half cleared","A government target for protection"],0,"For the Amazon it means rainforest shifting to savanna."]]},{"name":"Name the Driver","blurb":"Six drivers. Which one is doing the work here?","opts":["Cattle","Soy","Logging","Mining","Roads","Fire"],"q":[["A rancher clears 200 hectares and puts 40 cows on it, mainly to establish a claim to the land.",null,0,"Cattle. The cows are the land claim as much as the product."],["From 2006, traders refused to buy the crop if it came from land cleared after 2008.",null,1,"Soy. That was the Amazon Soy Moratorium."],["Mercury is poisoning rivers near remote, often illegal pits.",null,3,"Mining, particularly for gold."],["Side tracks branch off a new highway, then more tracks branch off those.",null,4,"Roads, and the fishbone effect."],["The most valuable trees are removed while the rest of the forest is left standing.",null,2,"Selective logging. It degrades rather than clears, and opens access."],["Land is cleared by burning, and in a drought year the burn escapes into standing forest.",null,5,"Fire. In 2024 about 60 per cent of Brazil's primary forest loss came from fire."],["BR-319, nicknamed \"the tipping point road\".",null,4,"Roads. It would open intact central Amazon forest."],["Responsible for about 41 per cent of all tropical deforestation worldwide.",null,0,"Cattle pasture, globally the biggest converted land use."],["A crop grown mostly as animal feed, expanding onto land that was already pasture.",null,1,"Soy. Its effect is mostly indirect: it pushes ranchers deeper in."],["Thousands of small operators rather than one large company, which makes enforcement extremely hard.",null,0,"Cattle. The driver is spread across thousands of people, which is exactly why laws alone struggle to stop it."]]},{"name":"Figure File","blurb":"The numbers that will carry your assessment.","q":[["Amazon forest cleared in the year to July 2025",["5,796 km2","11,796 km2","796 km2","25,796 km2"],0,"Down 11 per cent, the lowest in 11 years."],["Share of the original Amazon cleared so far",["About 13.2 per cent","About 31 per cent","About 3 per cent","About 50 per cent"],0,"13.2 per cent overall. The east is worse."],["Share of the eastern Amazon already cleared",["About 31 per cent","About 13 per cent","About 5 per cent","About 60 per cent"],0,"The eastern Amazon is already past the danger range."],["Cattle's share of Brazil's deforestation",["About 72 per cent","About 41 per cent","About 20 per cent","About 90 per cent"],0,"Around 72 per cent within Brazil."],["Cattle's share of tropical deforestation worldwide",["About 41 per cent","About 72 per cent","About 10 per cent","About 65 per cent"],0,"41 per cent globally, about 2.1 million hectares a year."],["Direct soy-driven clearing while the Soy Moratorium was in force",["Under 1 per cent of new soy area","About 30 per cent of new soy area","About 15 per cent of new soy area","About 50 per cent of new soy area"],0,"Down from about 30 per cent before the moratorium."],["Primary forest Brazil lost in 2024",["2.78 million hectares","278,000 hectares","27.8 million hectares","78,000 hectares"],0,"The highest since 2019, with about 60 per cent from fire."],["Amazon deforestation alerts, August 2025 to July 2026",["2,874 km2","5,796 km2","12,874 km2","874 km2"],0,"Down 36 per cent and the lowest since 2012-13."],["Where scientists roughly place the Amazon danger zone",["About 20 to 25 per cent cleared","About 50 to 60 per cent cleared","About 5 to 10 per cent cleared","About 80 per cent cleared"],0,"Around 20 to 25 per cent cleared. We are at 13.2 per cent."]]},{"name":"Deforestation or Degradation","blurb":"The distinction that separates a C from an A.","opts":["Deforestation","Degradation"],"q":[["Forest clear-cut and replaced with pasture for cattle.",null,0,"Deforestation. The forest is gone."],["Fire burning through standing forest during a drought year.",null,1,"Degradation. Damaged but still standing, and mostly uncounted."],["Selective logging removing only the largest, most valuable trees.",null,1,"Degradation. The forest remains but is thinned and opened up."],["Bulldozers stripping all vegetation to prepare a soy field.",null,0,"Deforestation. Complete removal."],["Forest edges drying out where they meet a newly cleared paddock.",null,1,"Degradation, known as the edge effect."],["A strip of forest cut and removed to build a new highway.",null,0,"Deforestation along the road corridor itself."],["The process that official Brazilian deforestation figures mostly count.",null,0,"Deforestation. Clear-cutting is what PRODES measures."],["The thing that rose 163 per cent between 2022 and 2024 while deforestation fell 54 per cent.",null,1,"Degradation. This is why a falling deforestation figure can mislead."],["Forest still standing but thinned, burnt and losing its ability to hold carbon.",null,1,"Degradation."]]}]};

let ri=0, qi=0, score=0, streak=0, best=0, roundErrors=0, misses=[], won={}, answered=false;
let gauge = CFG.gauge==='cover' ? CFG.gaugeStart : 0;

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LETTERS=['A','B','C','D','E','F'];

function total(){return CFG.rounds.reduce((n,r)=>n+r.q.length,0);}

function drawGauge(){
  if(CFG.gauge==='cover'){
    $('gVal').textContent=gauge.toFixed(1)+'%';
    $('gFill').style.width=gauge+'%';
    $('gMark').style.display='block';
    $('gMark').style.left=CFG.gaugeFloor+'%';
    $('gVal').style.color = gauge<CFG.gaugeFloor ? 'var(--bad)' : 'var(--accent)';
  }else{
    $('gVal').textContent=Math.round(gauge)+' / '+CFG.gaugeTarget;
    $('gFill').style.width=Math.min(100,(gauge/CFG.gaugeTarget)*100)+'%';
  }
}

function stats(){
  $('sRound').textContent=ri+1;
  $('sQ').textContent=qi+1;
  $('sScore').textContent=score;
  $('sStreak').textContent=streak;
}

function question(){
  const R=CFG.rounds[ri], item=R.q[qi];
  const rawOpts = item[1] ? item[1] : R.opts;
  const correctText = rawOpts[item[2]];
  const opts = shuffle(rawOpts);
  answered=false;
  stats(); drawGauge();

  $('stage').innerHTML =
    '<div class="round">Round '+(ri+1)+' &middot; '+R.name+'</div>'+
    '<div class="prompt">'+item[0]+'</div>'+
    '<div class="opts" id="opts"></div>'+
    '<div class="fb" id="fb"></div>'+
    '<div class="hint noprint">Tap an answer, or press '+LETTERS.slice(0,opts.length).join(', ')+' on a keyboard.</div>';

  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.dataset.i=i;
    b.innerHTML='<span class="key">'+LETTERS[i]+'</span><span>'+o+'</span>';
    b.onclick=()=>choose(i,o,correctText,item[3],opts);
    $('opts').appendChild(b);
  });
}

function choose(i,picked,correctText,why,opts){
  if(answered) return;
  answered=true;
  const right = picked===correctText;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(opts[j]===correctText) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
  });

  if(right){
    streak++; best=Math.max(best,streak);
    const bonus = streak>=5 ? 20 : streak>=3 ? 15 : 10;
    score+=bonus;
    if(CFG.gauge==='cover') gauge=Math.min(CFG.gaugeStart, gauge+0.4);
    else gauge+=CFG.gaugeTarget/total();
    if(streak>=5) won['Streak of five']=true;
    $('fb').className='fb ok show';
    $('fb').innerHTML='<b>Correct. +'+bonus+(streak>=3?' (streak bonus)':'')+'</b>'+why;
  }else{
    streak=0; roundErrors++;
    if(CFG.gauge==='cover') gauge=Math.max(0,gauge-1.2);
    misses.push({q:CFG.rounds[ri].q[qi][0], a:correctText, why:why});
    $('fb').className='fb no show';
    $('fb').innerHTML='<b>Not this time. The answer is: '+correctText+'</b>'+why;
  }

  const b=document.createElement('button');
  b.className='go'; b.textContent='Next';
  b.onclick=next;
  $('fb').appendChild(b);
  stats(); drawGauge();
}

function next(){
  qi++;
  if(qi<CFG.rounds[ri].q.length){ question(); return; }
  if(roundErrors===0) won['Clean sweep']=true;
  won[CFG.badges[Math.min(ri,2)][0]]=true;
  roundEnd();
}

function roundEnd(){
  const last = ri===CFG.rounds.length-1;
  if(last){ won['Full survey']=true; if(CFG.gauge==='cover'&&gauge>=CFG.gaugeFloor) won['Above the line']=true; }
  $('stage').innerHTML=
    '<div class="round">Round '+(ri+1)+' complete</div>'+
    '<div class="big">'+score+'</div>'+
    '<p style="color:var(--grey);margin-top:6px">'+
      (roundErrors===0?'Clean sweep. No mistakes at all.':roundErrors+' to review at the end.')+'</p>'+
    '<button class="go" id="nx">'+(last?'See your results':'Start Round '+(ri+2)+': '+CFG.rounds[ri+1].name)+'</button>'+
    (last?'':'<p class="hint">'+CFG.rounds[ri+1].blurb+'</p>');
  $('nx').onclick=()=>{ if(last){results();} else {ri++;qi=0;roundErrors=0;question();} };
}

function results(){
  const t=total(), max=t*10;
  let html='<div class="round">Finished</div><div class="big">'+score+'</div>'+
    '<p style="color:var(--grey);margin-top:6px">'+(t-misses.length)+' of '+t+
    ' correct. Longest streak: '+best+'. Base score out of '+max+', streak bonuses on top.</p>';

  html+='<h3 style="margin:22px 0 4px;font-size:17px">Badges</h3><div class="badges">';
  CFG.badges.forEach(b=>{
    html+='<div class="badge'+(won[b[0]]?' won':'')+'"><b>'+b[0]+'</b>'+b[1]+'</div>';
  });
  html+='</div>';

  if(misses.length){
    html+='<h3 style="margin:22px 0 8px;font-size:17px">Worth another look</h3>';
    misses.forEach(m=>{
      html+='<div class="miss"><div class="qq">'+m.q+'</div><div class="aa">'+m.a+' &mdash; '+m.why+'</div></div>';
    });
  }else{
    html+='<p style="margin-top:20px;color:var(--good);font-weight:700">Nothing to review. Every single one correct.</p>';
  }

  html+='<div class="noprint"><button class="go" id="pr">Print certificate</button>'+
        '<button class="go ghost" id="rs" style="margin-left:8px">Play again</button></div>';
  $('stage').innerHTML=html;

  $('pr').onclick=()=>{
    $('cert').innerHTML=
      '<h1 style="font-size:30px">'+CFG.title+'</h1>'+
      '<p style="color:#5A6660;margin-bottom:20px">'+CFG.subtitle+'</p>'+
      '<p style="font-size:16px">This certifies that</p>'+
      '<p style="border-bottom:1px solid #999;width:70%;margin:22px auto;height:34px"></p>'+
      '<p style="font-size:16px">scored</p>'+
      '<p style="font-size:52px;font-weight:800;color:'+CFG.accent+'">'+score+'</p>'+
      '<p style="font-size:15px">'+(t-misses.length)+' of '+t+' correct, longest streak '+best+'</p>'+
      '<p style="margin-top:26px;font-size:13px;color:#5A6660">Year 10 Geography &middot; Environmental Change and Management</p>';
    $('cert').style.display='block';
    window.print();
    setTimeout(()=>{$('cert').style.display='none';},400);
  };
  $('rs').onclick=()=>location.reload();
}

document.addEventListener('keydown',e=>{
  if(answered) return;
  const k=LETTERS.indexOf(e.key.toUpperCase());
  if(k>-1){ const b=document.querySelectorAll('.opt')[k]; if(b) b.click(); }
});

// intro
$('stage').innerHTML=
  '<div class="round">Before you start</div>'+
  '<div class="prompt">'+CFG.rounds.length+' rounds, '+total()+' questions.</div>'+
  '<p style="color:var(--grey)">Answers are shuffled every time, so learn the content, not the position. '+
  'Three in a row is worth 15, five in a row is worth 20. Everything you get wrong is saved for review at the end.</p>'+
  '<button class="go" id="st">Start Round 1: '+CFG.rounds[0].name+'</button>'+
  '<p class="hint">'+CFG.rounds[0].blurb+'</p>';
$('st').onclick=question;
drawGauge();
</script>
</body>
</html>
